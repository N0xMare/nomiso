[package]
name = "nomiso"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "SurrealDB-native agent memory foundation"
readme = "README.md"
[features]
# Lean default: embedded mem only. Enable remote-ws / rocks / http / mcp / embed as needed.
default = ["embedded-mem"]
remote-ws = ["nomiso-store/remote-ws"]
embedded-mem = ["nomiso-store/embedded-mem"]
embedded-rocks = ["nomiso-store/embedded-rocks"]
embedded-surrealkv = ["nomiso-store/embedded-surrealkv"]
http = ["dep:nomiso-http"]
mcp = ["dep:nomiso-mcp"]
embed = ["dep:nomiso-embed"]
blob = ["dep:nomiso-blob"]
full = ["remote-ws", "embedded-mem", "http", "mcp", "embed", "blob"]

[dependencies]
nomiso-core = { workspace = true }
nomiso-service = { workspace = true }
nomiso-store = { workspace = true, default-features = false }
nomiso-schema = { workspace = true }
nomiso-http = { workspace = true, optional = true }
nomiso-mcp = { workspace = true, optional = true }
nomiso-embed = { workspace = true, optional = true }
nomiso-blob = { workspace = true, optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
pretty_assertions = { workspace = true }
