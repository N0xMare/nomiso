[package]
name = "vegapunk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Vegapunk — opinionated agent memory system built on Nomiso"
readme = "README.md"

[features]
default = ["embedded-mem"]
embedded-mem = ["nomiso/embedded-mem"]
embedded-rocks = ["nomiso/embedded-rocks"]
remote-ws = ["nomiso/remote-ws"]
## Process backends for BYOM: Grok CLI + Codex CLI (`CliLlm`).
cli-llm = ["dep:tempfile", "tokio/process", "tokio/fs"]

[dependencies]
nomiso = { workspace = true }
nomiso-memory = { workspace = true }
nomiso-embed = { workspace = true }
nomiso-blob = { workspace = true }
nomiso-eval = { workspace = true }
tokio = { workspace = true, features = ["time", "process"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
